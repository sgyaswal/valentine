<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yay! 💕</title>
    <link rel="stylesheet" href="css/lastpage.css" />
  </head>
  <body>
    <div class="hearts-container"></div>
    <div class="celebration">🎉</div>
    <div id="thankyou"><b>Yay! I knew you'd say yes! 💕</b></div>
    <p class="love-message">You just made me the happiest person alive, Aishuu❤️! ✨</p>
    <br />
    <h1 class="next-step">Now let's plan something special! 🌹</h1>
    <button class="button" onclick="location.href='date.html'">
      Let's pick a date! 💖
    </button>

    <script>
      // Create floating hearts animation
      function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('floating-heart');
        const hearts = ['❤️', '💕', '💖', '💗', '💝'];
        heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.fontSize = (Math.random() * 10 + 20) + 'px';
        document.querySelector('.hearts-container').appendChild(heart);
        
        setTimeout(() => {
          heart.remove();
        }, 7000);
      }
      
      setInterval(createHeart, 300);
    </script>
  </body>
</html>
