<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/flower.css" />
  </head>
  <body>
    <img src="gf.jpeg" alt="Aishuu❤️" class="girlfriend-photo-final" />
    <div id="thankyou"><b>Thank you for being my girlfriend</b></div>
    
    <div id="summary" style="background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 10px; margin: 20px auto; max-width: 600px; text-align: left;">
      <h2 style="text-align: center; color: #ff1493;">Your Selections 💕</h2>
      <div id="summaryContent"></div>
    </div>

    <div class="flower">
      <div class="f-wrapper">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__leaf flower__leaf--5"></div>
          <div class="flower__leaf flower__leaf--6"></div>
          <div class="flower__leaf flower__leaf--7"></div>
          <div
            class="flower__leaf flower__leaf--8 flower__fall-down--yellow"
          ></div>
        </div>
      </div>

      <div class="f-wrapper f-wrapper--2">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__leaf flower__leaf--5"></div>
          <div class="flower__leaf flower__leaf--6"></div>
          <div class="flower__leaf flower__leaf--7"></div>
          <div
            class="flower__leaf flower__leaf--8 flower__fall-down--pink"
          ></div>
        </div>
      </div>

      <div class="f-wrapper f-wrapper--3">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__leaf flower__leaf--5"></div>
          <div class="flower__leaf flower__leaf--6"></div>
          <div class="flower__leaf flower__leaf--7"></div>
          <div
            class="flower__leaf flower__leaf--8 flower__fall-down--purple"
          ></div>
        </div>
      </div>
      <div class="flower__glass"></div>
    </div>

    <script>
      // Google Forms Configuration
      // Replace this with your Google Form's pre-filled URL
      const GOOGLE_FORM_URL = 'YOUR_GOOGLE_FORM_URL';
      
      // Google Form field IDs (entry.XXXXXXXX format)
      const FORM_FIELDS = {
        date: 'entry.000000001',
        food: 'entry.000000002',
        desserts: 'entry.000000003',
        activities: 'entry.000000004'
      };

      // Submit responses to Google Forms
      async function submitToGoogleForms() {
        const date = localStorage.getItem('selectedDate');
        const food = JSON.parse(localStorage.getItem('selectedFood') || '[]');
        const desserts = JSON.parse(localStorage.getItem('selectedDesserts') || '[]');
        const activities = JSON.parse(localStorage.getItem('selectedActivities') || '[]');

        // Check if already submitted
        if (localStorage.getItem('formSubmitted') === 'true') {
          console.log('Form already submitted for this session');
          return;
        }

        // Check if Google Form is configured
        if (GOOGLE_FORM_URL === 'YOUR_GOOGLE_FORM_URL') {
          console.log('⚠️ Google Form not configured. Please update GOOGLE_FORM_URL in lastpage.html');
          return;
        }

        try {
          // Create form data
          const formData = new FormData();
          
          // Format date
          const formattedDate = date 
            ? new Date(date).toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
              })
            : 'Not selected';
          
          formData.append(FORM_FIELDS.date, formattedDate);
          formData.append(FORM_FIELDS.food, food.join(', ') || 'None');
          formData.append(FORM_FIELDS.desserts, desserts.join(', ') || 'None');
          formData.append(FORM_FIELDS.activities, activities.join(', ') || 'None');

          // Submit to Google Forms
          await fetch(GOOGLE_FORM_URL, {
            method: 'POST',
            body: formData,
            mode: 'no-cors' // Required for Google Forms
          });

          console.log('✅ Response submitted to Google Forms!');
          localStorage.setItem('formSubmitted', 'true');
          
        } catch (error) {
          console.error('❌ Error submitting to Google Forms:', error);
        }
      }

      // Display all saved responses
      function displaySummary() {
        const summaryContent = document.getElementById('summaryContent');
        
        const date = localStorage.getItem('selectedDate');
        const food = JSON.parse(localStorage.getItem('selectedFood') || '[]');
        const desserts = JSON.parse(localStorage.getItem('selectedDesserts') || '[]');
        const activities = JSON.parse(localStorage.getItem('selectedActivities') || '[]');

        let html = '';
        
        if (date) {
          html += `<p><strong>📅 Date:</strong> ${new Date(date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>`;
        }
        
        if (food.length > 0) {
          html += `<p><strong>🍔 Food Choices:</strong> ${food.join(', ')}</p>`;
        }
        
        if (desserts.length > 0) {
          html += `<p><strong>🍰 Dessert Choices:</strong> ${desserts.join(', ')}</p>`;
        }
        
        if (activities.length > 0) {
          html += `<p><strong>🎨 Activities:</strong> ${activities.join(', ')}</p>`;
        }

        if (html === '') {
          html = '<p style="text-align: center; color: #999;">No selections saved yet</p>';
        }

        summaryContent.innerHTML = html;
      }

      // Run on page load
      displaySummary();
      submitToGoogleForms();
    </script>
  </body>
</html>
