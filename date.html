<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick Our Special Date 💕</title>
    <link rel="stylesheet" href="css/date.css" />
  </head>
  <body>
    <div class="hearts-container"></div>
    <h1 title="choose a date">When can I take you out, Aishwarya? 🌹</h1>
    <p class="subtitle">Pick a date when you're free and let's make it magical! ✨</p>
    <form class="form-group">
      <label>Choose our special day:</label>
      <div>
        <input type="date" required />
        <button class="button" type="submit" formaction="food.html">
          Perfect! Let's go! 💖
        </button>
      </div>
    </form>

    <script>
      // Create floating hearts animation
      function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('floating-heart');
        const hearts = ['❤️', '💕', '💖', '💗', '💝'];
        heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.fontSize = (Math.random() * 10 + 20) + 'px';
        document.querySelector('.hearts-container').appendChild(heart);
        
        setTimeout(() => {
          heart.remove();
        }, 7000);
      }
      
      setInterval(createHeart, 500);
    </script>
  </body>
</html>
