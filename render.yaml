{
  "services": [
    {
      "type": "web",
      "name": "valentine-website",
      "env": "node",
      "plan": "free",
      "buildCommand": "npm install",
      "startCommand": "npm start",
      "envVars": [
        {
          "key": "SMTP_HOST",
          "value": "smtp.gmail.com"
        },
        {
          "key": "SMTP_PORT",
          "value": "587"
        },
        {
          "key": "SMTP_USER",
          "generateValue": false
        },
        {
          "key": "SMTP_PASS",
          "generateValue": false
        },
        {
          "key": "RECIPIENT_EMAIL",
          "generateValue": false
        },
        {
          "key": "PORT",
          "value": "10000"
        }
      ]
    }
  ]
}
